<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Cruzamento Pokémon - RPG</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(20, 28, 44, 0.85);
            --bg-input: #121929;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-p1: #38bdf8;
            --accent-p2: #ec4899;
            --accent-alpha: #f43f5e;
            --accent-shiny: #fbbf24;
            --accent-success: #10b981;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(236, 72, 153, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            padding: 1.5rem 1rem 3rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            text-align: center;
            padding: 1.25rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .header-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.12);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .top-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .btn-download-self {
            padding: 0.45rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-download-self:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        .grid-parents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-p1 { border-top: 3px solid var(--accent-p1); }
        .card-p2 { border-top: 3px solid var(--accent-p2); }

        .card-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-p1 .card-header span { color: var(--accent-p1); }
        .card-p2 .card-header span { color: var(--accent-p2); }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .input-number {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .input-number:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .toggle-label:hover {
            border-color: var(--border-hover);
        }

        .toggle-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #1e293b;
            border-radius: 12px;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #94a3b8;
            transition: transform 0.2s, background-color 0.2s;
        }

        input[type="checkbox"] {
            display: none;
        }

        input[type="checkbox"]:checked + .toggle-label {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(99, 102, 241, 0.08);
        }

        input[type="checkbox"]:checked + .toggle-label .toggle-switch {
            background: var(--primary);
        }

        input[type="checkbox"]:checked + .toggle-label .toggle-switch::after {
            transform: translateX(20px);
            background: #ffffff;
        }

        .egg-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .egg-container-stable {
            min-height: 85px;
            background-color: var(--bg-input);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 4px 16px var(--primary-glow);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #1e293b;
            color: var(--text-main);
            box-shadow: none;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #334155;
            border-color: var(--border-hover);
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 1.5rem;
            display: none;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.active {
            display: block;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin: 1.25rem 0;
        }

        .badge-box {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .badge-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 0.6rem;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-alpha-yes {
            background-color: rgba(244, 63, 94, 0.15);
            color: var(--accent-alpha);
            border: 1px solid var(--accent-alpha);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.25);
        }

        .badge-shiny-yes {
            background-color: rgba(251, 191, 36, 0.15);
            color: var(--accent-shiny);
            border: 1px solid var(--accent-shiny);
            box-shadow: 0 0 14px rgba(251, 191, 36, 0.3);
        }

        .badge-no {
            background-color: rgba(51, 65, 85, 0.3);
            color: var(--text-subtle);
            border: 1px solid #334155;
        }

        .points-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .details-box {
            background-color: var(--bg-input);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.2rem;
            border-radius: 4px 12px 12px 4px;
            font-size: 0.925rem;
            line-height: 1.6;
            color: var(--text-main);
            margin-top: 1.25rem;
        }

        .status-success { color: var(--accent-success); font-weight: 700; }
        .status-fail { color: var(--accent-alpha); font-weight: 700; }
        .status-info { color: var(--accent-p1); font-weight: 600; }

        @media (max-width: 480px) {
            header h1 { font-size: 1.35rem; }
            .top-actions { position: static; text-align: right; margin-bottom: 0.5rem; }
            .points-display { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="top-actions">
        <button type="button" class="btn-download-self" onclick="salvarArquivoLocal()">Salvar Arquivo (.html)</button>
    </div>

    <header>
        <span class="header-tag">RPG Lab System</span>
        <h1>Calculadora de Cruzamento</h1>
        <p>Genética & Herança de Pontos Pokémon</p>
    </header>

    <div class="grid-parents">
        <!-- PAI -->
        <div class="card card-p1">
            <div class="card-header">
                <span>PAI</span>
            </div>
            <div class="form-group">
                <label for="p1-pontos">Pontos Totais</label>
                <input type="number" id="p1-pontos" class="input-number" placeholder="Ex: 150" min="0" value="100">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="p1-alfa">
                <label for="p1-alfa" class="toggle-label">
                    <span class="toggle-text">Porte Alfa</span>
                    <span class="toggle-switch"></span>
                </label>

                <input type="checkbox" id="p1-shiny">
                <label for="p1-shiny" class="toggle-label">
                    <span class="toggle-text">Pokémon Shiny</span>
                    <span class="toggle-switch"></span>
                </label>

                <input type="checkbox" id="p1-knot">
                <label for="p1-knot" class="toggle-label">
                    <span class="toggle-text">Destiny Knot</span>
                    <span class="toggle-switch"></span>
                </label>
            </div>
        </div>

        <!-- MÃE -->
        <div class="card card-p2">
            <div class="card-header">
                <span>MÃE</span>
            </div>
            <div class="form-group">
                <label for="p2-pontos">Pontos Totais</label>
                <input type="number" id="p2-pontos" class="input-number" placeholder="Ex: 150" min="0" value="100">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="p2-alfa">
                <label for="p2-alfa" class="toggle-label">
                    <span class="toggle-text">Porte Alfa</span>
                    <span class="toggle-switch"></span>
                </label>

                <input type="checkbox" id="p2-shiny">
                <label for="p2-shiny" class="toggle-label">
                    <span class="toggle-text">Pokémon Shiny</span>
                    <span class="toggle-switch"></span>
                </label>

                <input type="checkbox" id="p2-knot">
                <label for="p2-knot" class="toggle-label">
                    <span class="toggle-text">Destiny Knot</span>
                    <span class="toggle-switch"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Bônus do Treinador e Checagem do Ovo -->
    <div class="egg-section">
        <div class="checkbox-group">
            <input type="checkbox" id="shiny-charm">
            <label for="shiny-charm" class="toggle-label">
                <span class="toggle-text"><strong>Bônus do Treinador:</strong> Possui Shiny Charm</span>
                <span class="toggle-switch"></span>
            </label>
        </div>
        
        <button type="button" class="btn btn-secondary" onclick="verificarOvoSessao()">Verificar Ovo na Sessão</button>
        
        <div id="egg-container" class="egg-container-stable">
            <span class="status-info">Aguardando verificação do ovo...</span>
        </div>
    </div>

    <!-- Ação Principal -->
    <div>
        <button type="button" class="btn" onclick="gerarEstatisticasFilhote()">Gerar Estatísticas do Filhote</button>
    </div>

    <!-- Ficha do Filhote -->
    <div id="result-card" class="result-card">
        <div class="card-header">
            <span style="color: var(--text-main);">Ficha do Filhote Gerado</span>
        </div>

        <div class="badges-grid">
            <div class="badge-box">
                <div class="badge-title">Genética Alfa</div>
                <div id="badge-alfa" class="badge">NÃO</div>
            </div>

            <div class="badge-box">
                <div class="badge-title">Genética Shiny</div>
                <div id="badge-shiny" class="badge">NÃO</div>
            </div>

            <div class="badge-box">
                <div class="badge-title">Pontuação Final</div>
                <div id="points-output" class="points-display">0</div>
            </div>
        </div>

        <div class="details-box" id="calculation-details">
            Aguardando processamento...
        </div>
    </div>
</div>

<script>
    function salvarArquivoLocal() {
        const conteudo = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([conteudo], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'calculadora_cruzamento_pokemon.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function verificarOvoSessao() {
        const eggContainer = document.getElementById('egg-container');
        const obteveOvo = Math.random() < 0.50;

        if (obteveOvo) {
            const sessoesParaChocar = Math.floor(Math.random() * 6) + 1;
            eggContainer.innerHTML = `
                <span class="status-success">Ovo obtido com sucesso!</span>
                <span style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.35rem;">
                    Tempo necessário: <strong>${sessoesParaChocar} sessão(ões)</strong> para chocar (rolagem: 1d6).
                </span>
            `;
        } else {
            eggContainer.innerHTML = '<span class="status-fail">Nenhum ovo foi gerado nesta tentativa.</span>';
        }
    }

    function gerarEstatisticasFilhote() {
        const p1Pontos = parseInt(document.getElementById('p1-pontos').value, 10) || 0;
        const p1Alfa = document.getElementById('p1-alfa').checked;
        const p1Shiny = document.getElementById('p1-shiny').checked;
        const p1Knot = document.getElementById('p1-knot').checked;

        const p2Pontos = parseInt(document.getElementById('p2-pontos').value, 10) || 0;
        const p2Alfa = document.getElementById('p2-alfa').checked;
        const p2Shiny = document.getElementById('p2-shiny').checked;
        const p2Knot = document.getElementById('p2-knot').checked;

        const shinyCharm = document.getElementById('shiny-charm').checked;

        // 1. Genética Alfa
        let chanceAlfa = 0.10;
        if (p1Alfa && p2Alfa) {
            chanceAlfa = 0.50;
        } else if (p1Alfa || p2Alfa) {
            chanceAlfa = 0.25;
        }
        const isAlfa = Math.random() < chanceAlfa;

        // 2. Genética Shiny (Base dos Genitores + Modificador do Shiny Charm)
        let denominadorShiny = 4000;

        if ((p1Shiny && p2Shiny) && (p1Knot || p2Knot)) {
            denominadorShiny = 10;
        } else if ((p1Shiny && p1Knot) || (p2Shiny && p2Knot)) {
            denominadorShiny = 100;
        } else if (p1Shiny && p2Shiny) {
            denominadorShiny = 2000;
        } else if (p1Shiny || p2Shiny) {
            denominadorShiny = 3000;
        } else {
            denominadorShiny = 4000;
        }

        if (shinyCharm) {
            denominadorShiny = Math.round(denominadorShiny / 2);
        }

        const isShiny = Math.random() < (1 / denominadorShiny);

        // 3. Herança de Pontos
        let pontuacaoFinal = 0;
        let detalhamentoTexto = "";

        if (p1Knot || p2Knot) {
            let basePontos = 0;
            let secundarioPontos = 0;
            let nomePortador = "";

            if (p1Knot && p2Knot) {
                if (p1Pontos >= p2Pontos) {
                    basePontos = p1Pontos;
                    secundarioPontos = p2Pontos;
                    nomePortador = "Pai (Maior pontuação)";
                } else {
                    basePontos = p2Pontos;
                    secundarioPontos = p1Pontos;
                    nomePortador = "Mãe (Maior pontuação)";
                }
            } else if (p1Knot) {
                basePontos = p1Pontos;
                secundarioPontos = p2Pontos;
                nomePortador = "Pai";
            } else {
                basePontos = p2Pontos;
                secundarioPontos = p1Pontos;
                nomePortador = "Mãe";
            }

            const percentualBonus = Math.random() * 0.50;
            const pontosBonus = secundarioPontos * percentualBonus;
            pontuacaoFinal = Math.round(basePontos + pontosBonus);

            detalhamentoTexto = `Regra Aplicada: Destiny Knot (${nomePortador}). O filhote recebeu 100% dos pontos da base (${basePontos} pts) mais um bônus sorteado de ${(percentualBonus * 100).toFixed(1)}% do outro genitor (+${Math.round(pontosBonus)} pts).`;
        } else {
            const mediaAritmetica = (p1Pontos + p2Pontos) / 2;
            const sorteioMediaExata = Math.random() < 0.30;

            if (sorteioMediaExata) {
                pontuacaoFinal = Math.round(mediaAritmetica);
                detalhamentoTexto = `Regra Aplicada: Herança de Média Exata (30% de chance). O filhote herdou a média aritmética direta dos genitores (${mediaAritmetica.toFixed(1)} pts).`;
            } else {
                const fatorVariação = 0.70 + (Math.random() * 0.60);
                let calculoVariação = mediaAritmetica * fatorVariação;
                const limiteSomaTotal = p1Pontos + p2Pontos;

                if (calculoVariação > limiteSomaTotal) {
                    calculoVariação = limiteSomaTotal;
                }

                pontuacaoFinal = Math.round(calculoVariação);
                detalhamentoTexto = `Regra Aplicada: Variação Genética (70% de chance). Multiplicador de ${(fatorVariação * 100).toFixed(1)}% aplicado sobre a média dos pais (${mediaAritmetica.toFixed(1)} pts), com teto limitado à soma dos genitores (${limiteSomaTotal} pts).`;
            }
        }

        exibirFichaFilhote(isAlfa, isShiny, pontuacaoFinal, detalhamentoTexto);
    }

    function exibirFichaFilhote(isAlfa, isShiny, pontos, detalhamento) {
        const resultCard = document.getElementById('result-card');
        const badgeAlfa = document.getElementById('badge-alfa');
        const badgeShiny = document.getElementById('badge-shiny');
        const pointsOutput = document.getElementById('points-output');
        const calcDetails = document.getElementById('calculation-details');

        if (isAlfa) {
            badgeAlfa.textContent = "SIM";
            badgeAlfa.className = "badge badge-alpha-yes";
        } else {
            badgeAlfa.textContent = "NÃO";
            badgeAlfa.className = "badge badge-no";
        }

        if (isShiny) {
            badgeShiny.textContent = "SIM";
            badgeShiny.className = "badge badge-shiny-yes";
        } else {
            badgeShiny.textContent = "NÃO";
            badgeShiny.className = "badge badge-no";
        }

        pointsOutput.textContent = pontos;
        calcDetails.textContent = detalhamento;

        resultCard.classList.add('active');
        resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
</script>

</body>
</html>
