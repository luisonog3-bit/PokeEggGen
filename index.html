<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório de Cruzamento Pokémon</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #161f30;
      --input-bg: #0f172a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text-title: #f8fafc;
      --text-sub: #94a3b8;
      --border: #24334a;
      --border-highlight: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --gold: #f59e0b;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-title);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.75rem;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .egg-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .egg-status-container {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--input-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .egg-status-text {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .parents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-title);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .toggle-item:hover:not(.disabled-item) {
      border-color: var(--border-highlight);
    }

    .toggle-item.disabled-item {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
    }

    .toggle-item span {
      font-size: 0.9rem;
    }

    .toggle-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .toggle-item input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      background: #7dd3fc;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      background: var(--gold);
      width: auto;
      padding: 10px 20px;
      font-size: 0.9rem;
    }

    .btn-secondary:hover {
      background: #fcd34d;
    }

    .results-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
    }

    .badge-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-alpha-yes {
      background: rgba(168, 85, 247, 0.2);
      color: var(--purple);
      border: 1px solid var(--purple);
    }

    .badge-shiny-yes {
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .badge-no {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-sub);
      border: 1px solid var(--border);
    }

    .details-box {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-title);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Sistema de Cruzamento Pokémon</h1>
    <p>Calculadora genética e gerador de filhotes para RPG</p>
  </header>

  <!-- Verificação do Ovo -->
  <div class="card egg-card">
    <div class="card-title">Verificação de Ovo (1x por Sessão)</div>
    <button type="button" class="btn btn-secondary" onclick="tentarObterOvo()">Checar Obtenção de Ovo</button>
    <div class="egg-status-container" id="eggStatusBox">
      <span class="egg-status-text" id="eggStatusText">Aguardando verificação da sessão...</span>
    </div>
  </div>

  <!-- Genitores -->
  <div class="parents-grid">
    <!-- Pai -->
    <div class="card">
      <div class="card-title">PAI</div>
      <div class="form-group">
        <label for="p1Points">Pontos Totais</label>
        <input type="number" id="p1Points" value="10" min="0">
      </div>
      <div class="options-list">
        <label class="toggle-item">
          <span>Porte Alfa</span>
          <input type="checkbox" id="p1Alpha">
        </label>
        <label class="toggle-item">
          <span>Pokémon Shiny</span>
          <input type="checkbox" id="p1Shiny">
        </label>
        <label class="toggle-item" id="p1DKContainer">
          <span>Destiny Knot</span>
          <input type="checkbox" id="p1DK">
        </label>
      </div>
    </div>

    <!-- Mãe -->
    <div class="card">
      <div class="card-title">MÃE</div>
      <div class="form-group">
        <label for="p2Points">Pontos Totais</label>
        <input type="number" id="p2Points" value="10" min="0">
      </div>
      <div class="options-list">
        <label class="toggle-item">
          <span>Porte Alfa</span>
          <input type="checkbox" id="p2Alpha">
        </label>
        <label class="toggle-item">
          <span>Pokémon Shiny</span>
          <input type="checkbox" id="p2Shiny">
        </label>
        <label class="toggle-item" id="p2DKContainer">
          <span>Destiny Knot</span>
          <input type="checkbox" id="p2DK">
        </label>
      </div>
    </div>
  </div>

  <!-- Treinador -->
  <div class="card">
    <div class="card-title">Bônus do Treinador</div>
    <label class="toggle-item">
      <span>Possui Shiny Charm</span>
      <input type="checkbox" id="trainerCharm">
    </label>
  </div>

  <!-- Ação Principal -->
  <button type="button" class="btn" onclick="simularFilhote()">Gerar Estatísticas do Filhote</button>

  <!-- Painel de Resultados -->
  <div class="results-panel" id="resultsPanel">
    <div class="card-title">Ficha do Filhote Gerado</div>
    <div class="badge-group" id="badgeGroup"></div>
    <div class="details-box" id="detailsBox"></div>
  </div>
</div>

<script>
  // Controle exclusivo do Destiny Knot (apenas 1 genitor por vez)
  document.addEventListener('DOMContentLoaded', () => {
    const p1DK = document.getElementById('p1DK');
    const p2DK = document.getElementById('p2DK');
    const p1Container = document.getElementById('p1DKContainer');
    const p2Container = document.getElementById('p2DKContainer');

    p1DK.addEventListener('change', () => {
      if (p1DK.checked) {
        p2DK.checked = false;
        p2DK.disabled = true;
        p2Container.classList.add('disabled-item');
      } else {
        p2DK.disabled = false;
        p2Container.classList.remove('disabled-item');
      }
    });

    p2DK.addEventListener('change', () => {
      if (p2DK.checked) {
        p1DK.checked = false;
        p1DK.disabled = true;
        p1Container.classList.add('disabled-item');
      } else {
        p1DK.disabled = false;
        p1Container.classList.remove('disabled-item');
      }
    });
  });

  function tentarObterOvo() {
    const boxText = document.getElementById('eggStatusText');
    const obteveOvo = Math.random() < 0.5;

    if (obteveOvo) {
      const sessoes = Math.floor(Math.random() * 6) + 1;
      boxText.innerHTML = `<span style="color: var(--success); font-weight: 600;">✔ SUCESSO:</span> Ovo obtido! Vai chocar em <strong>${sessoes}</strong> sessão(ões) (1d6: ${sessoes}).`;
    } else {
      boxText.innerHTML = `<span style="color: var(--danger); font-weight: 600;">✘ FALHA:</span> Os Pokémons não geraram ovo nesta sessão.`;
    }
  }

  function simularFilhote() {
    const p1Points = parseInt(document.getElementById('p1Points').value, 10) || 0;
    const p2Points = parseInt(document.getElementById('p2Points').value, 10) || 0;

    const p1Alpha = document.getElementById('p1Alpha').checked;
    const p2Alpha = document.getElementById('p2Alpha').checked;

    const p1Shiny = document.getElementById('p1Shiny').checked;
    const p2Shiny = document.getElementById('p2Shiny').checked;

    const p1DK = document.getElementById('p1DK').checked;
    const p2DK = document.getElementById('p2DK').checked;

    const charm = document.getElementById('trainerCharm').checked;

    // 1. Sorteio de Alfa
    let chanceAlfa = 0.20; // Base: 0 Alfa = 20%
    if (p1Alpha && p2Alpha) {
      chanceAlfa = 0.70;   // 2 Alfas = 70%
    } else if (p1Alpha || p2Alpha) {
      chanceAlfa = 0.40;   // 1 Alfa = 40%
    }

    // Bônus de +15% se um Genitor ALFA estiver segurando o Destiny Knot
    const alphaComDK = (p1Alpha && p1DK) || (p2Alpha && p2DK);
    if (alphaComDK) {
      chanceAlfa += 0.15;
    }

    const isAlfa = Math.random() < chanceAlfa;

    // 2. Pontos do Filhote
    let pontosFinais = 0;
    let logPontos = "";

    if (p1DK || p2DK) {
      let basePts = 0;
      let outroPts = 0;
      let portador = "";

      if (p1DK) {
        basePts = p1Points; outroPts = p2Points; portador = "Pai";
      } else {
        basePts = p2Points; outroPts = p1Points; portador = "Mãe";
      }

      const maxBonus = Math.round(0.5 * outroPts);
      const bonusSorteado = Math.round(Math.random() * maxBonus);
      pontosFinais = basePts + bonusSorteado;

      logPontos = `Cálculo via Destiny Knot (${portador}):\n- Base do portador: ${basePts} pts\n- Bônus herdado (até 50% do outro genitor): +${bonusSorteado} pts\n- Total de pontos do filhote: ${pontosFinais} pts`;
    } else {
      const media = (p1Points + p2Points) / 2;
      const sorteioMedia = Math.random() < 0.30;

      if (sorteioMedia) {
        pontosFinais = Math.round(media);
        logPontos = `Cálculo via Média Exata:\n- Média aritmética dos pais (${p1Points} e ${p2Points})\n- Total de pontos do filhote: ${pontosFinais} pts`;
      } else {
        const minVal = Math.round(media * 0.7);
        const maxVal = Math.min(p1Points + p2Points, Math.round(media * 1.3));
        const minReal = Math.min(minVal, maxVal);
        const maxReal = Math.max(minVal, maxVal);

        pontosFinais = minReal + Math.round(Math.random() * (maxReal - minReal));
        logPontos = `Cálculo via Variação Genética:\n- Intervalo gerado da média: [${minReal} a ${maxReal}]\n- Total de pontos do filhote: ${pontosFinais} pts`;
      }
    }

    // 3. Sorteio de Shiny com redução pelo Shiny Charm
    let denominadorBase = 4000;
    const temDK = p1DK || p2DK;
    const shinyComDK = (p1Shiny && p1DK) || (p2Shiny && p2DK);

    if (p1Shiny && p2Shiny && temDK) {
      denominadorBase = 10;
    } else if (shinyComDK) {
      denominadorBase = 100;
    } else if (p1Shiny && p2Shiny) {
      denominadorBase = 2000;
    } else if (p1Shiny || p2Shiny) {
      denominadorBase = 3000;
    }

    let denominadorFinal = denominadorBase;
    if (charm) {
      denominadorFinal = Math.max(1, Math.floor(denominadorBase / 2));
    }

    const isShiny = (Math.floor(Math.random() * denominadorFinal) + 1) === 1;

    // Renderização dos Resultados
    const panel = document.getElementById('resultsPanel');
    const badgeGroup = document.getElementById('badgeGroup');
    const detailsBox = document.getElementById('detailsBox');

    panel.style.display = 'block';

    const strAlfa = isAlfa ? "SIM" : "NÃO";
    const strShiny = isShiny ? "SIM" : "NÃO";
    const pctAlfaStr = Math.round(chanceAlfa * 100);

    let badgesHTML = `<span class="badge ${isAlfa ? 'badge-alpha-yes' : 'badge-no'}">ALFA: ${strAlfa}</span>`;
    badgesHTML += `<span class="badge ${isShiny ? 'badge-shiny-yes' : 'badge-no'}">SHINY: ${strShiny}</span>`;
    badgesHTML += `<span class="badge badge-no">PONTOS: ${pontosFinais}</span>`;

    badgeGroup.innerHTML = badgesHTML;

    detailsBox.innerText = 
`> O Pokémon filhote é Alfa? ${strAlfa} (Chance nesta rolagem: ${pctAlfaStr}%${alphaComDK ? ' — incluindo +15% do Destiny Knot' : ''})
> O Pokémon filhote é Shiny? ${strShiny}
> Pontuação final herdada: ${pontosFinais} pts

[DETALHAMENTO DOS PONTOS]
${logPontos}`;
  }
</script>

</body>
</html>
